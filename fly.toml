app = "indexbeam-ai"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[processes]
  web = "npm run docker-start"
  worker = "npx tsx worker.ts"

[[vm]]
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  min_machines_running = 1
  auto_stop_machines = "stop"
  auto_start_machines = true

[[vm]]
  processes = ["worker"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  min_machines_running = 1

[[services]]
  internal_port = 3000
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
